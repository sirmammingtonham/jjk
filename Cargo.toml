[package]
name = "jjk"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "git/git-spice command semantics over Jujutsu (jj) for stacked GitHub PRs"
license = "MIT"

[[bin]]
name = "jjk"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
